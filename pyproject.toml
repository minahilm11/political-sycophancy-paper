[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "political-sycophancy-paper"
version = "0.1.0"
description = "Political-only data and reproducible manuscript figures"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.2", "plotly>=6.1", "kaleido>=1.0", "scipy>=1.12"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
